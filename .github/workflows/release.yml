name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Auto bump chart version (patch)
        id: bump_version
        run: |
          CHART_FILE=charts/neohoods-hub/Chart.yaml
          CURRENT=$(yq e '.version' $CHART_FILE)
          echo "Current chart version: $CURRENT"

          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)

          NEW_VERSION="$MAJOR.$MINOR.$((PATCH+1))"
          echo "Bumping to $NEW_VERSION"

          yq e -i ".version = \"$NEW_VERSION\"" $CHART_FILE

          git add $CHART_FILE
          git commit -m "chore(chart): bump neohoods-hub-chart to $NEW_VERSION"
          git push

          echo "bumped_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Run chart-releaser
        id: chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # Le déploiement n'est plus fait ici : Kargo (https://kargo.neohoods.com, projet neohub)
      # détecte la nouvelle version du chart et la promeut sur neohoods-hub-dev, puis prod à la main.
