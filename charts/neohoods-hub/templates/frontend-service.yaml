{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "neohoods-hub.frontendName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ include "neohoods-hub.frontendName" . }}
spec:
  type: {{ .Values.frontend.service.type | default "ClusterIP" }}
  selector:
    app: {{ include "neohoods-hub.frontendName" . }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.frontend.service.port | default 80 }}
      targetPort: http
{{- end }}
