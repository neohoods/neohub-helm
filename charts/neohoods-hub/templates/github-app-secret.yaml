{{/*
  Chart-managed GitHub App secret. Skipped when an existing Secret name is
  provided via `githubApp.existingSecret` (recommended in production: store the
  secret out-of-band, e.g. via SealedSecrets / external-secrets).
*/}}
{{- if and (not .Values.githubApp.existingSecret) (or .Values.githubApp.appId .Values.githubApp.installationId .Values.githubApp.privateKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: hub-{{ .Release.Name }}-github-app
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "neohoods-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  appId: {{ .Values.githubApp.appId | quote }}
  installationId: {{ .Values.githubApp.installationId | quote }}
  privateKey: |
{{ .Values.githubApp.privateKey | indent 4 }}
{{- end }}
