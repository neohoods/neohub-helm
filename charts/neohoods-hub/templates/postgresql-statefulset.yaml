{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "neohoods-hub.postgresName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ include "neohoods-hub.postgresName" . }}
    app.kubernetes.io/component: primary
    app.kubernetes.io/name: postgresql
    {{- include "neohoods-hub.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "neohoods-hub.postgresName" . }}
  replicas: 1
  {{- $rp := .Values.postgresql.primary.persistence.retentionPolicy | default dict }}
  {{- if ($rp.enabled | default true) }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "neohoods-hub.postgresName" . }}
  template:
    metadata:
      labels:
        app: {{ include "neohoods-hub.postgresName" . }}
        app.kubernetes.io/component: primary
        app.kubernetes.io/name: postgresql
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: {{ .Values.postgresql.auth.secretKeys.userPasswordKey }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args:
            - postgres
            - -c
            - max_connections={{ .Values.postgresql.primary.maxConnections | default 200 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.postgresql.primary.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U {{ .Values.postgresql.auth.username }} -d {{ .Values.postgresql.auth.database }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U {{ .Values.postgresql.auth.username }} -d {{ .Values.postgresql.auth.database }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    {{- if .Values.postgresql.primary.persistence.enabled }}
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.postgresql.primary.persistence.storageClass }}
        storageClassName: {{ .Values.postgresql.primary.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.primary.persistence.size }}
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "neohoods-hub.postgresName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ include "neohoods-hub.postgresName" . }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    app: {{ include "neohoods-hub.postgresName" . }}
{{- end }}
