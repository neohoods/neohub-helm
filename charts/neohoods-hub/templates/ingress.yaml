{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hub-{{ .Release.Name }}-ingress
  namespace: {{ .Values.global.namespace }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certManagerClusterIssuer }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  rules:
    - host: {{ .Values.global.domain | quote }}
      http:
        paths:
          {{- if .Values.frontend.enabled }}
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "neohoods-hub.frontendName" . }}
                port:
                  number: {{ .Values.frontend.service.port | default 80 }}
          {{- end }}
          {{- if .Values.backend.enabled }}
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: {{ include "neohoods-hub.backendName" . }}
                port:
                  number: {{ .Values.backend.service.port | default 80 }}
          {{- end }}
  tls:
    - hosts:
        - {{ .Values.global.domain | quote }}
      secretName: {{ .Values.ingress.secretName | default (printf "hub-%s-letsencrypt" .Release.Name) }}
{{- end }}
