{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hub-{{ .Release.Name }}-ingress
  namespace: {{ .Values.global.namespace }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certManagerClusterIssuer }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  rules:
    - host: {{ .Values.global.domain | quote }}
      http:
        paths:
          {{- if .Values.frontend.enabled }}
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "neohoods-hub.frontendName" . }}
                port:
                  number: {{ .Values.frontend.service.port | default 80 }}
          {{- end }}
          {{- if .Values.backend.enabled }}
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: {{ include "neohoods-hub.backendName" . }}
                port:
                  number: {{ .Values.backend.service.port | default 80 }}
          {{- end }}
  tls:
    - hosts:
        - {{ .Values.global.domain | quote }}
      secretName: {{ .Values.ingress.secretName | default (printf "hub-%s-letsencrypt" .Release.Name) }}
{{- if .Values.ingress.wwwRedirectHost }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hub-{{ .Release.Name }}-www-redirect
  namespace: {{ .Values.global.namespace }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certManagerClusterIssuer }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # ingress-nginx rejects $request_uri in permanent-redirect on this cluster; apex is enough for SEO.
    nginx.ingress.kubernetes.io/permanent-redirect: https://{{ .Values.global.domain }}
spec:
  # microk8s controller watches --ingress-class=public; www redirect must use that class.
  ingressClassName: {{ .Values.ingress.wwwClassName | default "public" }}
  rules:
    - host: {{ .Values.ingress.wwwRedirectHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "neohoods-hub.frontendName" . }}
                port:
                  number: {{ .Values.frontend.service.port | default 80 }}
  tls:
    - hosts:
        - {{ .Values.ingress.wwwRedirectHost | quote }}
      secretName: {{ .Values.ingress.wwwSecretName | default (printf "%s-www" (.Values.ingress.secretName | default (printf "hub-%s-letsencrypt" .Release.Name))) }}
{{- end }}
{{- end }}
